# «Закат» prototype 3: «рождение», the core of flesh, captured tiles, buildings, creatures, «преторианец».

- type: npcFaction
  id: ZakatFlesh
  hostile:
  - NanoTrasen
  - Syndicate
  - Passive
  - PetsNT
  - Zombie
  - Revolutionary
  - Dragon
  - Xeno
  - AllHostile
  - Xenoborg
  - Heretic
  - Blob
  - PirateFaction
  - SimpleHostile
  - SimpleNeutral
  - Gilbert
  - ShogkkOperative
  - ShogkkZombified

# ---------- the disease's actions after Рост 3 ----------

- type: entity
  parent: BaseMentalAction
  id: ActionZakatBirth
  name: Birth
  description: lets you come into the world
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Zakat/actions.rsi
      state: p3_birth
  - type: TargetAction
    checkCanAccess: false
    range: 0
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState # hosts are checked on the server; the client doesn't know who is infected
    event: !type:ZakatBirthActionEvent

- type: entity
  parent: BaseMentalAction
  id: BaseActionZakatBuild
  abstract: true
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 1
  - type: TargetAction
    checkCanAccess: false
    range: 0
    interactOnMiss: false
  - type: WorldTargetAction
    event: !type:ZakatBuildActionEvent

- type: entity
  parent: BaseActionZakatBuild
  id: ActionZakatBuildSpewer
  name: Mass spewer
  description: mines mass
  components:
  - type: Action
    icon:
      sprite: _CorvaxGoob/Zakat/actions.rsi
      state: p3_spewer
  - type: WorldTargetAction
    event: !type:ZakatBuildActionEvent
      structure: Spewer

- type: entity
  parent: BaseActionZakatBuild
  id: ActionZakatBuildWall
  name: Biomass wall
  components:
  - type: Action
    icon:
      sprite: _CorvaxGoob/Zakat/actions.rsi
      state: p4_wall
  - type: WorldTargetAction
    event: !type:ZakatBuildActionEvent
      structure: Wall

- type: entity
  parent: BaseActionZakatBuild
  id: ActionZakatBuildDoor
  name: Biomass door
  components:
  - type: Action
    icon:
      sprite: _CorvaxGoob/Zakat/actions.rsi
      state: p4_door
  - type: WorldTargetAction
    event: !type:ZakatBuildActionEvent
      structure: Door

- type: entity
  parent: BaseActionZakatBuild
  id: ActionZakatBuildCocoonSmall
  name: Cocoon of small creatures
  components:
  - type: Action
    icon:
      sprite: _CorvaxGoob/Zakat/actions.rsi
      state: p3_cocoon_small
  - type: WorldTargetAction
    event: !type:ZakatBuildActionEvent
      structure: SmallCocoon

- type: entity
  parent: BaseActionZakatBuild
  id: ActionZakatBuildCocoonHunter
  name: Hunter cocoon
  components:
  - type: Action
    icon:
      sprite: _CorvaxGoob/Zakat/actions.rsi
      state: p3_cocoon_hunter
  - type: WorldTargetAction
    event: !type:ZakatBuildActionEvent
      structure: HunterCocoon

- type: entity
  parent: BaseActionZakatBuild
  id: ActionZakatBuildCocoonLarge
  name: Cocoon of large creatures
  components:
  - type: Action
    icon:
      sprite: _CorvaxGoob/Zakat/actions.rsi
      state: p3_cocoon_large
  - type: WorldTargetAction
    event: !type:ZakatBuildActionEvent
      structure: LargeCocoon

- type: entity
  parent: BaseMentalAction
  id: ActionZakatLiberate
  name: Release from shackles
  components:
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Zakat/actions.rsi
      state: p3_liberate
  - type: TargetAction
    checkCanAccess: false
    range: 0
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState # hosts are checked on the server; the client doesn't know who is infected
    event: !type:ZakatLiberateActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionZakatPraetorian
  name: Create a praetorian
  components:
  - type: Action
    useDelay: 2
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Zakat/actions.rsi
      state: p3_praetorian
  - type: TargetAction
    checkCanAccess: false
    range: 0
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidAppearance
    event: !type:ZakatPraetorianActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionZakatToCore
  name: To the core
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _CorvaxGoob/Zakat/actions.rsi
      state: p3_to_core
  - type: InstantAction
    event: !type:ZakatToCoreActionEvent

# ---------- praetorian / hunter actions ----------

- type: entity
