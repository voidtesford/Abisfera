    replies: [ pulsar-chat-farewell-1, pulsar-chat-farewell-2 ]
  - id: greeting
    phrases: [ привет, здравств, здорово$, добрый день, доброе утро, добрый вечер, доброй ночи, хай$, салют, приветству, хелло, хеллоу, ку$, дарова, здарова ]
    replies: [ pulsar-chat-greeting-1, pulsar-chat-greeting-2, pulsar-chat-greeting-3 ]
  - id: howareyou
    phrases: [ как настроени, как жизнь ]
    replies: [ pulsar-chat-mood-1, pulsar-chat-mood-2 ]

