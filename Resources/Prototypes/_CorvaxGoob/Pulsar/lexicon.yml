  # Small talk, checked in this order (the first matching topic answers).
  chatTopics:
  - id: thanks
    phrases: [ спасиб, благодар, спс$, пасиб, мерси$, сенкс$ ]
    replies: [ pulsar-chat-thanks-1, pulsar-chat-thanks-2, pulsar-chat-thanks-3 ]
  - id: status
    kind: Status
    phrases: [ как дела, как ты, как обстановк, как обстанов, как на станции, статус, доклад, докладывай, отчет, обстановк, сводк, что нового, что происходит, все в порядке, всё в порядке, как сам ]
  - id: help
    phrases: [ что умеешь, что ты умеешь, что можешь, что ты можешь, команд$, команды$, справк, инструкц, как тобой пользоват, как с тобой работат, что ты делаешь, чем занимаешься, зачем ты ]
    replies: [ pulsar-chat-help-1, pulsar-chat-help-2 ]
  # «Помощь!»: someone in trouble, not a question about the AI.
  - id: distress
    phrases: [ помощ, помоги$, помогите, спаси, спасите, sos$ ]
    replies: [ pulsar-chat-distress-1, pulsar-chat-distress-2 ]
  - id: identity
    phrases: [ кто ты, ты кто, что ты такое, представься, представьтесь, как тебя зовут, твое имя, кто это, кто говорит, ты человек, ты робот ]
