# A basic inheritable template for a gun that is wieldable and has the standard inaccuracy.
- type: entity
  id: BaseGunWieldable
  abstract: true
  components:
  - type: Wieldable
    unwieldOnUse: false
  # Hip-fire: original trash (21–32°). Wielded: slightly tighter than stock (0–1°).
  - type: GunWieldBonus
    minAngle: -21
    maxAngle: -31
  - type: RestrictGunshotsByUserTag # Goobstation
    doesntContain:
    - Oni
    messages:
    - oni-cannot-shoot-guns-1
    - oni-cannot-shoot-guns-2
    - oni-cannot-shoot-guns-3
  - type: Gun
    minAngle: 21
    maxAngle: 32
    # Abisfera: less spread climb during sustained full-auto while wielded
    angleIncrease: 0.35
    angleDecay: 6
