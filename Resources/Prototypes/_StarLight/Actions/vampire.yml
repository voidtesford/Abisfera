# Base abilities

- type: entity
  parent: BaseAction
  id: ActionVampireToggleFangs
  name: Переключить клыки
  description: Выдвигайте или убирайте клыки, чтобы пить кровь жертв.
  components:
    - type: Action
      useDelay: 2 # Toggle
      itemIconStyle: NoItem
      priority: 1
      icon:
        sprite: _Starlight/Interface/Actions/actions_vampire.rsi
        state: fangs_retracted
      iconOn:
        sprite: _Starlight/Interface/Actions/actions_vampire.rsi
        state: fangs_extended
    - type: InstantAction
      event: !type:VampireToggleFangsActionEvent {}
    - type: VampireAction
      bloodToUnlock: 0
      bloodCost: 0

- type: entity
  parent: BaseAction
  id: ActionVampireGlare
  name: Взгляд
  description: Уставиться на ближайшие цели, парализуя и лишая их голоса.
  components:
    - type: Action
      useDelay: 60
      itemIconStyle: NoItem
      priority: 2
      icon:
        sprite: _Starlight/Interface/Actions/actions_vampire.rsi
        state: glare
    - type: InstantAction
      event: !type:VampireGlareActionEvent
        dotTickCount: 10
        dotTickInterval: 1
    - type: VampireAction
      bloodToUnlock: 0
      bloodCost: 0

- type: entity
  parent: BaseAction
  id: ActionVampireSleep
  name: Сон (15)
  description: Отправьте жертву в состояние временного сна.
  components:
    - type: Action
      useDelay: 2
      itemIconStyle: NoItem
      priority: 25
      icon:
        sprite: _Starlight/Interface/Actions/actions_vampire.rsi
        state: sleep_icon
    - type: TargetAction
      range: 2
      checkCanAccess: false
      interactOnMiss: false
    - type: EntityTargetAction
      canTargetSelf: false
      whitelist:
        components:
          - HumanoidAppearance
      event: !type:VampireSleepActionEvent
    - type: VampireAction
      bloodToUnlock: 0
      bloodCost: 15

- type: entity
  parent: BaseAction
  id: ActionVampireRejuvenateI
  name: Омоложение
  description: Снимает любые оглушения, восстанавливает выносливость.
  components:
    - type: Action
      useDelay: 35
      itemIconStyle: NoItem
      priority: 3
      checkCanInteract: false
      checkConsciousness: false
      icon:
        sprite: _Starlight/Interface/Actions/actions_vampire.rsi
        state: rejuvinate
    - type: InstantAction
      event: !type:VampireRejuvenateIActionEvent {}
    - type: VampireAction
      bloodToUnlock: 0
      bloodCost: 0

- type: entity
  parent: BaseAction
  id: ActionVampireRejuvenateII
  name: Омоложение II
  description: Снимает любые эффекты оглушения, восстанавливает выносливость. Устраняет действие ядов и обеспечивает постепенное исцеление.
  components:
    - type: Action
      useDelay: 30
      itemIconStyle: NoItem
      priority: 4
      checkCanInteract: false
      checkConsciousness: false
      icon:
        sprite: _Starlight/Interface/Actions/actions_vampire.rsi
        state: rejuvinate
    - type: InstantAction
      event: !type:VampireRejuvenateIIActionEvent
        reagentPurgeAmount: 10
        purgedMetabolismStages:
        - Bloodstream
        healTicks: 5
        healTickInterval: 3.5
        healGroups:
          Brute: 4
          Burn: 4
        healTypes:
          Poison: 4
          Asphyxiation: 5
    - type: VampireAction
      bloodToUnlock: 200
      bloodCost: 0

- type: entity
