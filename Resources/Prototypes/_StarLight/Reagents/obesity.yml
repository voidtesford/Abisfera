# Analyzer reagent only. Gameplay fat is ObesityTrackerComponent.FatAmount.
- type: reagent
  id: ExcessFat
  name: reagent-name-excess-fat
  group: Biological
  desc: reagent-desc-excess-fat
  physicalDesc: reagent-physical-desc-opaque
  flavor: bitter
  color: "#8B6914"

# 5u Molecule → −1 fat (ObesitySystem). Side effects via metabolisms.
# Recipe: 2 Ephedrine + 1 Bicaridine + 1 Razorium (бритвиум).
- type: reagent
  id: Molecule
  name: reagent-name-molecule
  group: Medicine
  desc: reagent-desc-molecule
  physicalDesc: reagent-physical-desc-powdery
  flavor: medicine
  color: "#2266FF"
  plantMetabolism:
  - !type:PlantAdjustToxins
    amount: 0.3
  metabolisms:
    Medicine:
      metabolismRate: 0.5
      effects:
      - !type:HealthChange
        damage:
          types:
            Slash: 0.5
            Poison: 0.1
      - !type:SatiateHunger
        factor: -3
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Molecule
          min: 20
        damage:
          types:
            Slash: 1.5
            Poison: 0.5
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Molecule
          min: 20
        type: Local
        visualType: MediumCaution
        messages: [ "obesity-molecule-overdose" ]
        probability: 0.15
